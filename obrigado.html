<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagem enviada — Contécnica</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .thanks{ min-height:100vh; display:grid; place-items:center; text-align:center; padding:40px 22px; }
    .thanks__card{ max-width:520px; background:#fff; border:1px solid var(--borda); border-radius:var(--radius); padding:48px 34px; box-shadow:var(--sombra); }
    .thanks__ico{ width:80px; height:80px; margin:0 auto 22px; border-radius:50%; background:var(--grad); display:grid; place-items:center; font-size:2.4rem; color:#1A1A1A; }
    .thanks h1{ font-family:'Playfair Display',serif; font-size:1.9rem; margin-bottom:12px; }
    .thanks p{ color:var(--cinza-texto); margin-bottom:26px; }
    .thanks.err .thanks__ico{ background:#f3f3f3; }
  </style>
</head>
<body>
  <div class="thanks" id="thanks">
    <div class="thanks__card">
      <div class="thanks__ico" id="ico">✓</div>
      <h1 id="title">Mensagem enviada!</h1>
      <p id="msg">Obrigado pelo contato. A equipe da Contécnica retornará em breve. Se preferir, fale agora mesmo pelo WhatsApp.</p>
      <a href="https://wa.me/5511984752466" target="_blank" rel="noopener" class="btn btn--wpp btn--lg">Falar no WhatsApp</a>
      <p style="margin-top:20px;"><a href="index.html" style="text-decoration:underline;color:#b9791a;font-weight:600;">Voltar para o início</a></p>
    </div>
  </div>
  <script>
    (function(){
      var status = new URLSearchParams(location.search).get('status');
      if (status === 'erro') {
        document.getElementById('thanks').classList.add('err');
        document.getElementById('ico').textContent = '!';
        document.getElementById('title').textContent = 'Não foi possível enviar';
        document.getElementById('msg').textContent = 'Ocorreu um erro no envio. Por favor, tente novamente ou fale conosco pelo WhatsApp.';
      }
    })();
  </script>
</body>
</html>
