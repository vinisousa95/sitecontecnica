<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ambiente reformado pela Contécnica">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#3d3d3d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a06a"/>
      <stop offset="100%" stop-color="#a8824f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#FFD34D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- wall panels -->
  <rect x="0" y="0" width="1200" height="560" fill="#f2ede4"/>
  <rect x="0" y="0" width="1200" height="560" fill="#000" opacity="0.02"/>
  <!-- window -->
  <rect x="120" y="90" width="360" height="300" rx="6" fill="#dfe9ef"/>
  <rect x="120" y="90" width="360" height="300" rx="6" fill="none" stroke="#1A1A1A" stroke-width="10"/>
  <line x1="300" y1="90" x2="300" y2="390" stroke="#1A1A1A" stroke-width="8"/>
  <line x1="120" y1="240" x2="480" y2="240" stroke="#1A1A1A" stroke-width="8"/>
  <!-- shelf -->
  <rect x="640" y="150" width="420" height="18" rx="4" fill="#8a6a44"/>
  <rect x="700" y="170" width="30" height="90" fill="#c98b3a"/>
  <rect x="760" y="180" width="26" height="80" fill="#4a6b52"/>
  <rect x="820" y="165" width="34" height="95" fill="#b6553f"/>
  <!-- accent swoosh -->
  <path d="M0 470 C 300 420, 800 430, 1200 400 L 1200 470 Z" fill="url(#accent)" opacity="0.9"/>
  <!-- floor -->
  <rect x="0" y="560" width="1200" height="240" fill="url(#floor)"/>
  <g stroke="#8f6c40" stroke-width="2" opacity="0.5">
    <line x1="0" y1="620" x2="1200" y2="620"/>
    <line x1="0" y1="690" x2="1200" y2="690"/>
    <line x1="0" y1="760" x2="1200" y2="760"/>
    <line x1="200" y1="560" x2="140" y2="800"/>
    <line x1="500" y1="560" x2="470" y2="800"/>
    <line x1="800" y1="560" x2="820" y2="800"/>
  </g>
  <!-- sofa -->
  <rect x="720" y="470" width="360" height="120" rx="18" fill="#3f4a55"/>
  <rect x="720" y="440" width="360" height="70" rx="16" fill="#4c5966"/>
  <rect x="740" y="480" width="150" height="70" rx="12" fill="#5a6a78"/>
  <rect x="900" y="480" width="150" height="70" rx="12" fill="#5a6a78"/>
  <!-- plant -->
  <rect x="150" y="470" width="70" height="110" rx="6" fill="#7a5a34"/>
  <path d="M185 470 C 150 400, 150 360, 185 340 C 220 360, 220 400, 185 470 Z" fill="#3f6b48"/>
</svg>
